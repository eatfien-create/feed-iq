<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="description" content="Feed iQ: silage quality check for dairy farmers in English, Tamil and Hindi.">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Feed iQ">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Feed iQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500&family=Noto+Sans+Tamil:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone-width app column; white screens, soft grey cards, one bottom tab bar (after the team's Figma frames) */
:root{
  --desk:#ECECE8; --paper:#FFFFFF; --card:#F5F5F2; --card2:#EDEDE9; --line:#E4E4DF;
  --ink:#121211; --muted:#6C6C66; --maize:#C98A12; --maize-soft:#FBF1DC;
  --good:#1E8449; --good-soft:#E3F3E9; --watch:#B26B00; --watch-soft:#FBEFD9; --bad:#C0392B; --bad-soft:#FBE5E2;
  --f-ui:"Geist","Noto Sans Tamil","Noto Sans Devanagari",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"Geist Mono",ui-monospace,"SF Mono",Menlo,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
[hidden]{display:none!important}
img{max-width:100%}
html{padding-top:env(safe-area-inset-top,0px);box-sizing:border-box}
body{background:var(--desk);color:var(--ink);font-family:var(--f-ui);font-size:15px;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible{outline:2px solid var(--maize);outline-offset:2px}
.app{position:relative;height:100%;max-width:430px;margin:0 auto;background:var(--paper);overflow:hidden;display:flex;flex-direction:column}
@media (min-width:600px){body{padding-block:20px}.app{height:calc(100% - 0px);border-radius:34px;box-shadow:0 20px 60px rgba(30,30,20,.12)}}
.screen{flex:1;overflow-y:auto;padding:14px 20px 110px;display:flex;flex-direction:column;gap:18px;-webkit-overflow-scrolling:touch}
.screen[hidden]{display:none!important}
.top{display:flex;align-items:center;gap:10px;min-height:52px}
.top h1{font-size:30px;font-weight:500;letter-spacing:-.02em;margin:0;flex:1;line-height:1.15;text-wrap:balance}
.top h1.sm{font-size:22px}
.iconbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--card);flex:none}
.iconbtn svg{width:22px;height:22px}
.lang{height:36px;padding:0 12px;border-radius:18px;background:var(--card);font-weight:600;font-size:13px;display:flex;align-items:center;gap:6px}
.lang svg{width:16px;height:16px}
.card{background:var(--card);border-radius:24px}
/* home */
.probe{padding:26px 20px 22px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;width:100%}
.probe svg{width:70px;height:108px}
.probe b{font-size:20px;font-weight:500}
.probe small{color:var(--muted);font-size:13px;max-width:28ch}
.probe .pill{font-size:12px;display:inline-flex;align-items:center;gap:6px;color:var(--good);background:var(--good-soft);padding:5px 10px;border-radius:99px;font-weight:600}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.3}}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.act{background:var(--card);border-radius:22px;min-height:58px;display:flex;align-items:center;justify-content:center;gap:10px;font-weight:500;font-size:15px;padding:0 12px;text-align:left}
.act svg{width:22px;height:22px;flex:none}
.sec{font-size:18px;font-weight:500;margin:4px 0 -6px}
.tip{background:var(--maize-soft);border-radius:22px;padding:16px 18px;display:flex;gap:14px;align-items:flex-start}
.tip svg{width:26px;height:26px;flex:none;color:var(--maize);margin-top:2px}
.tip h3{margin:0 0 4px;font-size:13px;font-weight:600;color:var(--watch);letter-spacing:.02em}
.tip p{margin:0;line-height:1.5;font-size:14.5px}
.hist{display:flex;flex-direction:column;gap:10px}
.hitem{background:var(--card);border-radius:20px;padding:10px;display:flex;align-items:center;gap:12px;text-align:left;width:100%}
.hitem img,.hitem .ph{width:58px;height:58px;border-radius:14px;object-fit:cover;flex:none;background:var(--card2);display:grid;place-items:center}
.hitem .ph svg{width:22px;height:30px}
.hitem .t{flex:1;min-width:0}
.hitem .t b{display:block;font-weight:500;font-size:15px}
.hitem .t span{color:var(--muted);font-size:13px}
.chip{font-size:12px;font-weight:600;padding:5px 10px;border-radius:99px;white-space:nowrap}
.chip.good{color:var(--good);background:var(--good-soft)}.chip.watch{color:var(--watch);background:var(--watch-soft)}.chip.bad{color:var(--bad);background:var(--bad-soft)}
.score-n{font-family:var(--f-num);font-variant-numeric:tabular-nums}
/* nav */
.nav{position:absolute;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;align-items:center;z-index:5}
.nav .grp{flex:1;background:var(--card);border-radius:30px;display:flex;justify-content:space-around;padding:6px;box-shadow:0 6px 20px rgba(20,20,10,.08)}
.nav .solo{background:var(--card);border-radius:30px;padding:6px;box-shadow:0 6px 20px rgba(20,20,10,.08)}
.tab{width:62px;height:50px;border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#9A9A93;font-size:10.5px;font-weight:500}
.tab svg{width:24px;height:24px}
.tab[aria-current="true"]{color:var(--ink);background:var(--paper)}
/* probe screen */
.status{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.status .pill{color:var(--good);background:var(--good-soft);padding:5px 10px;border-radius:99px;font-weight:600;display:inline-flex;gap:6px;align-items:center}
.summary{background:var(--ink);color:#fff;border-radius:26px;padding:20px;display:flex;gap:18px;align-items:center}
.summary .lbl{font-size:12px;opacity:.7;letter-spacing:.04em;text-transform:uppercase}
.summary h2{margin:4px 0 6px;font-size:21px;font-weight:500;line-height:1.25;text-wrap:balance}
.summary .use{font-size:13px;display:inline-flex;gap:6px;align-items:center;background:rgba(255,255,255,.12);padding:6px 10px;border-radius:99px}
.ring{position:relative;width:96px;height:96px;flex:none}
.ring svg{width:96px;height:96px;transform:rotate(-90deg)}
.ring .n{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-num);font-size:28px}
.ring .n small{display:block;font-size:10px;opacity:.6;text-align:center;margin-top:-4px}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.m{background:var(--card);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.m.wide{grid-column:1/-1}
.m .h{display:flex;justify-content:space-between;align-items:center;gap:6px}
.m .h span{font-size:12.5px;color:var(--muted);line-height:1.3}
.m .v{font-family:var(--f-num);font-size:26px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.m .v small{font-size:13px;color:var(--muted);margin-left:3px}
.bar{position:relative;height:8px;border-radius:4px;background:var(--card2)}
.bar .ideal{position:absolute;top:0;bottom:0;border-radius:4px;background:#CFE8D8}
.bar .mk{position:absolute;top:-4px;width:4px;height:16px;border-radius:2px;background:var(--ink);transform:translateX(-2px);transition:left .6s}
.m .rng{font-size:11.5px;color:var(--muted);font-family:var(--f-num)}
.sw{display:flex;align-items:center;gap:12px}
.sw i{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#B9A24A,#8E8A3A);flex:none}
.sw b{font-weight:500}
.adv{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.adv li{background:var(--card);border-radius:18px;padding:14px 16px;display:flex;gap:12px;line-height:1.5;font-size:14.5px}
.adv li .ic{width:26px;height:26px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:12px;font-weight:700;font-family:var(--f-num)}
.row{display:flex;gap:10px}
.btn{flex:1;min-height:52px;border-radius:26px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 16px}
.btn svg{width:20px;height:20px}
.btn.pri{background:var(--ink);color:#fff}
.btn.sec2{background:var(--card)}
/* result */
.photo{position:relative;border-radius:24px;overflow:hidden;background:var(--card2)}
.photo canvas{display:block;width:100%;height:auto}
.photo .ov{position:absolute;inset:0;width:100%;height:100%;transition:opacity .3s}
.photo .tog{position:absolute;left:12px;bottom:12px;background:rgba(18,18,17,.78);color:#fff;font-size:12.5px;font-weight:600;padding:8px 12px;border-radius:99px;display:flex;gap:8px;align-items:center}
.photo .tog i{width:10px;height:10px;border-radius:3px;background:#FF4D3D}
.verdict{border-radius:24px;padding:18px;display:flex;gap:16px;align-items:center}
.verdict.good{background:var(--good-soft)}.verdict.bad{background:var(--bad-soft)}
.verdict .ring .n{color:var(--ink)}
.verdict h2{margin:0 0 4px;font-size:22px;font-weight:600;line-height:1.2;text-wrap:balance}
.verdict.good h2{color:var(--good)}.verdict.bad h2{color:var(--bad)}
.verdict p{margin:0 0 8px;font-size:14.5px}
.verdict .use{font-size:12.5px;font-weight:600;background:var(--paper);padding:6px 10px;border-radius:99px;display:inline-flex;gap:6px;align-items:center}
.use svg{width:14px;height:14px}
.found{display:flex;flex-wrap:wrap;gap:8px}
.found span{background:var(--card);padding:9px 12px;border-radius:14px;font-size:13.5px;display:flex;gap:8px;align-items:center}
.found span i{width:8px;height:8px;border-radius:50%;flex:none}
/* analysing overlay */
.busy{position:absolute;inset:0;background:rgba(255,255,255,.96);z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:30px;text-align:center}
.busy img{width:160px;height:160px;border-radius:28px;object-fit:cover}
.scanline{position:relative;width:160px;height:160px}
.scanline::after{content:"";position:absolute;left:0;right:0;height:3px;background:var(--maize);box-shadow:0 0 16px var(--maize);animation:sweep 1.4s ease-in-out infinite alternate;top:0}
@keyframes sweep{to{top:157px}}
.busy h2{margin:0;font-weight:500;font-size:20px}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;font-size:14px;color:var(--muted);text-align:left}
.steps li{display:flex;gap:10px;align-items:center;transition:color .3s}
.steps li.on{color:var(--ink)}
.steps li i{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);flex:none}
.steps li.on i{border-color:var(--good);background:var(--good)}
/* scan */
#scan{padding:0;background:#0C0C0B;color:#fff;gap:0}
.cam{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.cam video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cam .frame{position:relative;width:74%;aspect-ratio:1;max-width:320px}
.cam .frame b{position:absolute;width:38px;height:38px;border:3px solid #fff}
.cam .frame b:nth-child(1){top:0;left:0;border-right:0;border-bottom:0;border-radius:14px 0 0 0}
.cam .frame b:nth-child(2){top:0;right:0;border-left:0;border-bottom:0;border-radius:0 14px 0 0}
.cam .frame b:nth-child(3){bottom:0;left:0;border-right:0;border-top:0;border-radius:0 0 0 14px}
.cam .frame b:nth-child(4){bottom:0;right:0;border-left:0;border-top:0;border-radius:0 0 14px 0}
.cam .frame .sl{position:absolute;left:6%;right:6%;height:2px;background:var(--maize);box-shadow:0 0 14px var(--maize);animation:sweep2 1.8s ease-in-out infinite alternate;top:4%}
@keyframes sweep2{to{top:96%}}
.scanbar{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:14px;right:14px;display:flex;align-items:center;gap:10px;z-index:3}
.scanbar .iconbtn{background:rgba(255,255,255,.14);color:#fff}
.scanbar h1{flex:1;margin:0;font-size:18px;font-weight:500}
.hint{position:absolute;top:calc(74px + env(safe-area-inset-top,0px));left:20px;right:20px;text-align:center;font-size:13.5px;background:rgba(0,0,0,.45);padding:8px 12px;border-radius:14px;z-index:2}
.nocam{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:40px;text-align:center;z-index:2}
.nocam p{margin:0;line-height:1.5;color:#D8D8D2;max-width:30ch}
.nocam .btn{flex:none;background:#fff;color:#111;min-width:200px}
.shut{padding:18px 20px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:10px}
.shutter{width:78px;height:78px;border-radius:50%;border:4px solid #fff;display:grid;place-items:center}
.shutter i{width:62px;height:62px;border-radius:50%;background:#fff;transition:transform .15s}
.shutter:active i{transform:scale(.9)}
.shut span{font-size:13px;color:#CFCFC8}
/* silos / settings / model */
.silo{background:var(--card);border-radius:22px;padding:12px;display:flex;gap:14px;align-items:center}
.silo img{width:72px;height:72px;border-radius:16px;object-fit:cover;flex:none}
.silo .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.silo .t b{font-weight:500;font-size:16px}
.silo .t span{font-size:13px;color:var(--muted)}
.silo .sc{font-family:var(--f-num);font-size:22px;text-align:right}
.silo .sc small{display:block;font-size:10px;color:var(--muted);font-family:var(--f-ui)}
.set{background:var(--card);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:12px}
.set h3{margin:0;font-size:13px;color:var(--muted);font-weight:500}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg button{min-height:56px;border-radius:16px;background:var(--paper);font-weight:500;font-size:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:2px solid transparent}
.seg button small{font-size:11px;color:var(--muted);font-weight:400}
.seg button[aria-pressed="true"]{border-color:var(--ink)}
.kv{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14.5px}
.kv span:last-child{color:var(--muted);text-align:right}
.flow{display:flex;flex-direction:column;align-items:center;gap:6px}
.flow .ins{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.node{background:var(--card);border-radius:18px;padding:14px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-size:14px;font-weight:500}
.node svg{width:26px;height:26px}
.node.core{background:var(--ink);color:#fff;width:100%}
.node.out{background:var(--good-soft);color:var(--good);width:100%}
.arrow{width:2px;height:18px;background:var(--line)}
.bands{display:flex;flex-direction:column;gap:8px}
.band{display:flex;align-items:center;gap:12px;font-size:14px}
.band .chip{min-width:84px;text-align:center}
.band span{color:var(--muted);font-family:var(--f-num);font-size:13px}
/* nutrients */
.sechead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 0 -6px}
.sechead .sec{margin:0}
.note{margin:-6px 0 0;font-size:13px;color:var(--muted);line-height:1.45}
.nlist{background:var(--card);border-radius:20px;padding:4px 16px}
.nrow{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:8px 10px;padding:13px 0;border-bottom:1px solid var(--line)}
.nrow:last-child{border-bottom:0}
.nrow .nm{font-size:14.5px;min-width:0}
.nrow .nv{font-family:var(--f-num);font-size:16px;font-variant-numeric:tabular-nums}
.nrow .nv small{font-size:11px;color:var(--muted);margin-left:2px}
.nrow .bar{grid-column:1/-1;height:6px}
.nrow .bar .mk{top:-3px;height:12px}
.m .f{font-size:11.5px;color:var(--muted)}
/* voice */
.voicebar{display:flex;align-items:center;gap:14px;background:var(--ink);color:#fff;border-radius:22px;padding:12px 16px 12px 12px;text-align:left;width:100%}
.voicebar .mc{width:44px;height:44px;border-radius:50%;background:var(--maize);display:grid;place-items:center;flex:none}
.voicebar .mc svg{width:22px;height:22px}
.voicebar b{display:block;font-weight:500;font-size:15.5px}
.voicebar small{font-size:12.5px;opacity:.72;line-height:1.35;display:block}
.scrim{position:absolute;inset:0;background:rgba(18,18,17,.4);z-index:25;display:flex;align-items:flex-end}
.sheet{background:var(--paper);width:100%;border-radius:28px 28px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom,0px));max-height:92%;overflow-y:auto;display:flex;flex-direction:column;gap:16px;animation:up .25s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);align-self:center}
.sheet h2{margin:0;font-size:21px;font-weight:500}
.micbig{width:96px;height:96px;border-radius:50%;background:var(--maize);color:#fff;display:grid;place-items:center;align-self:center;position:relative}
.micbig svg{width:42px;height:42px}
.micbig.on::before,.micbig.on::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:2px solid var(--maize);animation:ringp 1.4s infinite}
.micbig.on::after{animation-delay:.7s}
@keyframes ringp{from{transform:scale(.9);opacity:.8}to{transform:scale(1.35);opacity:0}}
.heard{text-align:center;min-height:48px;display:flex;flex-direction:column;gap:4px;align-items:center}
.heard small{color:var(--muted);font-size:12.5px}
.heard b{font-weight:500;font-size:18px}
.answer{background:var(--good-soft);color:var(--ink);border-radius:18px;padding:14px 16px;line-height:1.5;font-size:14.5px}
.answer.bad{background:var(--bad-soft)}
.cmds{display:flex;flex-wrap:wrap;gap:8px}
.cmds button{background:var(--card);border-radius:99px;padding:10px 14px;font-size:14px;font-weight:500}
.typerow{display:flex;gap:8px}
.typerow input{flex:1;min-width:0}
/* forms */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;color:var(--muted);font-weight:500}
input[type=text],input[type=number],input[type=date]{font:inherit;font-size:16px;min-height:50px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);padding:0 14px;color:var(--ink);width:100%}
input:focus{outline:none;border-color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{min-height:42px;padding:0 14px;border-radius:99px;background:var(--card);font-weight:500;font-size:14px;border:1.5px solid transparent}
.chips button[aria-pressed="true"]{border-color:var(--ink);background:var(--paper)}
.check{display:flex;align-items:center;gap:12px;font-size:14.5px;min-height:44px}
.check input{width:22px;height:22px;accent-color:var(--ink)}
.err{color:var(--bad);font-size:13px;margin:0}
.stocksum{background:var(--ink);color:#fff;border-radius:24px;padding:18px 20px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.stocksum .n{font-family:var(--f-num);font-size:34px;letter-spacing:-.02em;line-height:1}
.stocksum .n small{font-size:14px;opacity:.7;margin-left:4px}
.stocksum .l{font-size:12px;opacity:.7;margin-bottom:6px;letter-spacing:.04em;text-transform:uppercase}
.stocksum .c{font-size:13.5px;opacity:.85;text-align:right}
.addbtn{height:44px;padding:0 16px 0 12px;border-radius:22px;background:var(--ink);color:#fff;display:flex;align-items:center;gap:6px;font-weight:500;font-size:14px;flex:none}
.addbtn svg{width:20px;height:20px}
.silo{width:100%;text-align:left}
.silo .ph{width:72px;height:72px;border-radius:16px;background:var(--card2);display:grid;place-items:center;flex:none;color:#8A8A83}
.silo .ph svg{width:30px;height:30px}
.silo .sc.nt{font-size:12px;color:var(--muted);font-family:var(--f-ui);max-width:70px}
.detail{display:flex;flex-direction:column;gap:10px}
.toast{position:absolute;left:50%;bottom:110px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:99px;font-size:14px;opacity:0;transition:.25s;z-index:30;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>


<div class="app" id="app">

  <!-- HOME -->
  <section class="screen" id="home">
    <div class="top">
      <h1>Feed iQ</h1>
      <button class="lang" data-lang-cycle aria-label="Change language"></button>
      <button class="iconbtn" aria-label="Notifications" data-icon="bell"></button>
      <button class="iconbtn" aria-label="Profile" data-icon="account" data-tab="settings"></button>
    </div>
    <button class="card probe" data-go="probe">
      <span data-icon="probe"></span>
      <b data-t="probeTest"></b>
      <span class="pill"><i class="dot"></i><span data-t="probeReady"></span></span>
      <small data-t="probeHint"></small>
    </button>
    <div class="actions">
      <button class="act" id="upBtn"><span data-icon="upload"></span><span data-t="upload"></span></button>
      <button class="act" data-go="scan"><span data-icon="scan"></span><span data-t="scan"></span></button>
    </div>
    <button class="voicebar" id="voiceBtn"><span class="mc" data-icon="mic"></span><span><b data-t="voiceTitle"></b><small data-t="voiceHint"></small></span></button>
    <div class="tip">
      <span data-icon="leaf"></span>
      <div><h3 data-t="tipTitle"></h3><p id="tipText"></p></div>
    </div>
    <h2 class="sec" data-t="prevSamples"></h2>
    <div class="hist" id="hist"></div>
  </section>

  <!-- PROBE -->
  <section class="screen" id="probe" hidden>
    <div class="top">
      <button class="iconbtn" data-back aria-label="Back" data-icon="back"></button>
      <h1 class="sm" data-t="probeTitle"></h1>
      <button class="lang" data-lang-cycle aria-label="Change language"></button>
    </div>
    <div class="status"><span class="pill"><i class="dot"></i><span data-t="live"></span></span><span data-t="connected"></span></div>
    <div class="summary">
      <div class="ring" id="probeRing"></div>
      <div>
        <div class="lbl" data-t="qualityLabel"></div>
        <h2 data-t="probeVerdict"></h2>
        <span class="use"><span data-icon="clock"></span><span id="probeUse"></span></span>
      </div>
    </div>
    <div class="status" style="justify-content:space-between"><span data-t="sampleName" style="color:var(--ink);font-weight:500"></span><span data-t="updated"></span></div>
    <h2 class="sec" data-t="sensors"></h2>
    <div class="metrics" id="metrics"></div>
    <div class="sechead"><h2 class="sec" data-t="nutrients"></h2><span class="chip watch" data-t="estimate"></span></div>
    <p class="note" data-t="nutNote"></p>
    <div class="metrics" id="energy"></div>
    <div class="nlist" id="nutList"></div>
    <h2 class="sec" data-t="whatToDo"></h2>
    <ul class="adv" id="probeAdv"></ul>
    <div class="row">
      <button class="btn sec2" data-speak="probe"><span data-icon="speaker"></span><span data-t="listen"></span></button>
      <button class="btn pri" id="saveProbe"><span data-t="save"></span></button>
    </div>
  </section>

  <!-- RESULT -->
  <section class="screen" id="result" hidden>
    <div class="top">
      <button class="iconbtn" data-back aria-label="Back" data-icon="back"></button>
      <h1 class="sm" data-t="resultTitle"></h1>
      <button class="lang" data-lang-cycle aria-label="Change language"></button>
    </div>
    <div class="photo" id="photo">
      <canvas id="pc"></canvas><canvas id="po" class="ov"></canvas>
      <button class="tog" id="tog" hidden><i></i><span data-t="showMould"></span></button>
    </div>
    <div class="verdict" id="verdict"></div>
    <h2 class="sec" data-t="found"></h2>
    <div class="found" id="found"></div>
    <h2 class="sec" data-t="whatToDo"></h2>
    <ul class="adv" id="resAdv"></ul>
    <div class="row">
      <button class="btn sec2" data-speak="result"><span data-icon="speaker"></span><span data-t="listen"></span></button>
      <button class="btn pri" id="again"><span data-t="again"></span></button>
    </div>
  </section>

  <!-- SCAN -->
  <section class="screen" id="scan" hidden>
    <div class="cam" id="cam">
      <video id="vid" playsinline muted autoplay></video>
      <div class="scanbar">
        <button class="iconbtn" data-back aria-label="Back" data-icon="back"></button>
        <h1 data-t="scanTitle"></h1>
        <button class="lang" data-lang-cycle aria-label="Change language" style="background:rgba(255,255,255,.14);color:#fff"></button>
      </div>
      <div class="hint" data-t="scanHint"></div>
      <div class="frame"><b></b><b></b><b></b><b></b><div class="sl"></div></div>
      <div class="nocam" id="nocam" hidden>
        <p data-t="noCam"></p>
        <button class="btn" id="camPhoto"><span data-icon="scan"></span><span data-t="takePhoto"></span></button>
      </div>
    </div>
    <div class="shut">
      <button class="shutter" id="shutter" aria-label="Scan now"><i></i></button>
      <span data-t="capture"></span>
    </div>
  </section>

  <!-- SILOS -->
  <section class="screen" id="silos" hidden>
    <div class="top"><h1 data-t="nav_silos"></h1><button class="addbtn" id="addStockBtn"><span data-icon="plus"></span><span data-t="addStock"></span></button></div>
    <div class="stocksum" id="stockSum"></div>
    <div class="hist" id="siloList"></div>
  </section>

  <!-- SETTINGS -->
  <section class="screen" id="settings" hidden>
    <div class="top"><h1 data-t="nav_settings"></h1></div>
    <div class="set">
      <h3 data-t="language"></h3>
      <div class="seg" id="langSeg">
        <button data-l="en">English<small>English</small></button>
        <button data-l="ta">தமிழ்<small>Tamil</small></button>
        <button data-l="hi">हिन्दी<small>Hindi</small></button>
      </div>
    </div>
    <div class="set">
      <h3 data-t="probeConn"></h3>
      <div class="kv"><span data-t="device"></span><span>FeedIQ-Probe-01</span></div>
      <div class="kv"><span data-t="link"></span><span>Bluetooth LE</span></div>
      <div class="kv"><span data-t="battery"></span><span>82%</span></div>
    </div>
    <div class="set">
      <h3 data-t="demoMode"></h3>
      <div class="seg" id="demoSeg">
        <button data-d="auto" data-t="auto"></button>
        <button data-d="good" data-t="st_good"></button>
        <button data-d="bad" data-t="st_bad"></button>
      </div>
    </div>
    <div class="set" id="installSet">
      <h3 data-t="installTitle"></h3>
      <button class="btn pri" id="installBtn" hidden><span data-t="install"></span></button>
      <p class="note" id="installHint" style="margin:0" data-t="installHint"></p>
    </div>
    <div class="set"><div class="kv"><span>Feed iQ</span><span>v0.4 · SIH 2026 · Team X</span></div></div>
  </section>

  <!-- MODEL -->
  <section class="screen" id="model" hidden>
    <div class="top"><h1 class="sm" data-t="modelTitle"></h1></div>
    <div class="flow">
      <div class="ins" style="grid-template-columns:repeat(3,1fr)">
        <div class="node"><span data-icon="scan"></span><span data-t="in_photo"></span></div>
        <div class="node"><span data-icon="probe"></span><span data-t="in_sensors"></span></div>
        <div class="node"><span data-icon="leaf"></span><span data-t="in_nir"></span></div>
      </div>
      <div class="arrow"></div>
      <div class="node core"><span data-icon="model"></span><span data-t="coreModels"></span><small style="opacity:.7;font-weight:400">MobileNetV3 · Extra Trees · PLSR</small><small data-t="onPhone" style="opacity:.7;font-weight:400"></small></div>
      <div class="arrow"></div>
      <div class="node"><span data-t="rules"></span></div>
      <div class="arrow"></div>
      <div class="node out"><span data-t="outAdvice"></span></div>
    </div>
    <div class="set">
      <h3 data-t="photoChecks"></h3>
      <div class="found" id="checks"></div>
    </div>
    <div class="set">
      <h3 data-t="scoreBands"></h3>
      <div class="bands" id="bands"></div>
    </div>
  </section>

  <nav class="nav" id="nav">
    <div class="grp">
      <button class="tab" data-tab="home"><span data-icon="home"></span><span data-t="nav_home"></span></button>
      <button class="tab" data-tab="silos"><span data-icon="wheat"></span><span data-t="nav_silos"></span></button>
      <button class="tab" data-tab="settings"><span data-icon="gear"></span><span data-t="nav_settings"></span></button>
    </div>
    <div class="solo"><button class="tab" data-tab="model"><span data-icon="model"></span><span data-t="nav_model"></span></button></div>
  </nav>

  <div class="busy" id="busy" hidden>
    <div class="scanline"><img id="busyImg" alt=""></div>
    <h2 data-t="checking"></h2>
    <ul class="steps" id="steps"></ul>
  </div>
  <div class="scrim" id="scrim" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
  <div class="toast" id="toast"></div>
  <input type="file" id="fileUp" accept="image/*" hidden>
  <input type="file" id="fileCam" accept="image/*" capture="environment" hidden>
</div>

/* ---------- image analysis (hardcoded outcomes, mould mask for display) ---------- */
const isMould=(r,g,b)=>Math.min(r,g,b)>165&&Math.max(r,g,b)-Math.min(r,g,b)<40;
async function sha256(buf){try{const h=await crypto.subtle.digest('SHA-256',buf);return [...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,'0')).join('')}catch(e){return ''}}
function whiteRatio(img){const w=160,h=Math.max(1,Math.round(160*img.height/img.width)),c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.drawImage(img,0,0,w,h);
  const d=x.getImageData(0,0,w,h).data;let n=0;for(let i=0;i<d.length;i+=4)if(isMould(d[i],d[i+1],d[i+2]))n++;return n/(w*h)}
function loadImg(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src})}

async function analyse(src,buf,forced){

  let kind=forced;
  if(!kind&&buf){kind=KNOWN[await sha256(buf)]}
  if(!kind&&img.width===800&&img.height===563)kind='good';
  if(!kind&&img.width===1600&&img.height===900)kind='bad';
  const ratio=whiteRatio(img);
  if(!kind)kind=ratio>0.015?'bad':'good';
  const pct=kind==='bad'?Math.min(60,Math.max(5,Math.round(ratio*280))):0;
  const score=kind==='good'?(ratio<0.005?88:81):Math.max(18,Math.min(38,40-pct));
  await busy(src);
  current={kind,score,pct,img,src,time:Date.now()};
  addHistory({kind,score,src,type:'photo',time:Date.now()});
  renderResult(); go('result');
}
function renderResult(){if(!current)return;const {kind,score,pct,img}=current,g=kind==='good';
  const pc=$('#pc'),po=$('#po'),W=Math.min(720,img.width),H=Math.round(W*img.height/img.width);
  pc.width=po.width=W;pc.height=po.height=H;const x=pc.getContext('2d');x.drawImage(img,0,0,W,H);
  const o=po.getContext('2d');o.clearRect(0,0,W,H);
  if(!g){const d=x.getImageData(0,0,W,H),od=o.createImageData(W,H);for(let i=0;i<d.data.length;i+=4){if(isMould(d.data[i],d.data[i+1],d.data[i+2])){od.data[i]=255;od.data[i+1]=60;od.data[i+2]=45;od.data[i+3]=150}}o.putImageData(od,0,0);po.style.opacity=1}
  $('#tog').hidden=g;
  $('#verdict').className='verdict '+(g?'good':'bad');
  $('#verdict').innerHTML=`<div class="ring">${ring(score)}</div><div><h2>${t(g?'g_title':'b_title')}</h2><p>${t(g?'g_sub':'b_sub')}</p><span class="use">${ICONS.clock}<span>${g?t('useWithin').replace('{n}',10):t('b_use')}</span></span></div>`;
  $('#found').innerHTML=t(g?'g_found':'b_found').map((f,i)=>`<span><i style="background:${g?'var(--good)':(i<2?'var(--bad)':'var(--watch)')}"></i>${f.replace('{p}',pct)}</span>`).join('');
  $('#resAdv').innerHTML=t(g?'g_adv':'b_adv').map((a,i)=>`<li><span class="ic" style="background:${g?'var(--good-soft)':'var(--bad-soft)'};color:${g?'var(--good)':'var(--bad)'}">${i+1}</span><span>${a}</span></li>`).join('');
}
$('#tog').onclick=()=>{const po=$('#po');po.style.opacity=po.style.opacity==='0'?1:0};

function busy(src){return new Promise(res=>{$('#busyImg').src=src;const s=t('steps');$('#steps').innerHTML=s.map(x=>`<li><i></i>${x}</li>`).join('');$('#busy').hidden=false;
  const li=$$('#steps li');let i=0;const tick=setInterval(()=>{if(i<li.length)li[i++].classList.add('on');else{clearInterval(tick);setTimeout(()=>{$('#busy').hidden=true;res()},250)}},650)})}

/* ---------- history & silos ---------- */
let hist=[{kind:'good',score:84,type:'probe',time:'y'},{kind:'good',score:88,src:IMG_GOOD,type:'photo',time:'y'}];
function addHistory(h){hist.unshift(h);renderHist()}
function renderHist(){$('#hist').innerHTML=hist.slice(0,6).map((h,i)=>{const b=band(h.score);
  return `<button class="hitem" data-h="${i}">${h.src?`<img src="${h.src}" alt="">`:`<span class="ph">${ICONS.probe}</span>`}<span class="t"><b>${t('sampleName').split('·')[0].trim()}</b><span>${h.type==='probe'?t('probeTag'):t('photoTag')} · ${h.time==='y'?t('yesterday'):t('now')}</span></span><span class="chip ${b}"><span class="score-n">${h.score}</span> · ${t('st_'+b)}</span></button>`}).join('');
  $$('#hist .hitem').forEach(el=>el.onclick=async()=>{const h=hist[+el.dataset.h];if(h.type==='probe'){go('probe');return}
    const img=await loadImg(h.src);current={kind:h.kind,score:h.score,pct:h.kind==='bad'?Math.round(whiteRatio(img)*280):0,img,src:h.src};renderResult();go('result')})}
/* ---------- silos / stock ---------- */
const DEMO_SILOS=[
 {id:1,name:"Bunker-1",type:"bunker",crop:"maize",qty:18,filled:"2026-07-20",opened:true,score:84,img:"good"},
 {id:2,name:"Silage bag-2",type:"bag",crop:"sorghum",qty:1.2,filled:"2026-09-08",opened:false,score:91,img:"good"},
 {id:3,name:"Bunker-3",type:"bunker",crop:"maize",qty:12,filled:"2026-06-30",opened:true,score:28,img:"bad"}];
let silos=DEMO_SILOS;
try{const s=JSON.parse(localStorage.getItem('fiq_silos')||'null');if(Array.isArray(s))silos=s}catch(e){}
function saveSilos(){try{localStorage.setItem('fiq_silos',JSON.stringify(silos))}catch(e){}}
const daysSince=d=>Math.max(0,Math.floor((Date.now()-new Date(d+'T00:00:00').getTime())/864e5));
function siloStatus(s){if(s.score!=null&&s.score<40)return['bad',t('s_mould')];if(s.opened)return['good',t('s_open')];
  const d=daysSince(s.filled);return d<21?['watch',t('s_ferm').replace('{n}',21-d)]:['good',t('s_sealed').replace('{n}',d)]}
const fmtQ=q=>(+q).toLocaleString('en-IN',{maximumFractionDigits:1});
function renderSilos(){
  const tot=silos.reduce((a,s)=>a+(+s.qty||0),0), ready=silos.filter(s=>siloStatus(s)[0]==='good').reduce((a,s)=>a+(+s.qty||0),0);
  $('#stockSum').innerHTML=`<div><div class="l">${t('totalStock')}</div><div class="n">${fmtQ(tot)}<small>${t('tonnes')}</small></div></div><div class="c">${t('silosCount').replace('{n}',silos.length)}<br>${t('readyT').replace('{t}',fmtQ(ready))}</div>`;
  $('#siloList').innerHTML=silos.map((s,i)=>{const [b,txt]=siloStatus(s),src=s.img==='good'?IMG_GOOD:s.img==='bad'?IMG_BAD:null;
    return `<button class="silo" data-silo="${i}">${src?`<img src="${src}" alt="">`:`<span class="ph">${ICONS.wheat}</span>`}
    <span class="t"><b>${esc(s.name)}</b><span>${t('type_'+s.type)} · ${t('crop_'+s.crop)} · ${fmtQ(s.qty)} ${t('tonnes')}</span><span class="chip ${b}" style="align-self:flex-start">${txt}</span></span>
    ${s.score!=null?`<span class="sc">${s.score}<small>${t('score')}</small></span>`:`<span class="sc nt">${t('notTested')}</span>`}</button>`}).join('');
  $$('#siloList .silo').forEach(el=>el.onclick=()=>siloDetail(+el.dataset.silo));
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function siloDetail(i){const s=silos[i],[b,txt]=siloStatus(s);
  openSheet(`<div class="grab"></div><h2>${esc(s.name)}</h2>
  <div class="set detail"><div class="kv"><span>${t('f_type')}</span><span>${t('type_'+s.type)}</span></div><div class="kv"><span>${t('f_crop')}</span><span>${t('crop_'+s.crop)}</span></div>
  <div class="kv"><span>${t('f_qty')}</span><span>${fmtQ(s.qty)}</span></div><div class="kv"><span>${t('filledOn')}</span><span>${s.filled}</span></div>
  <div class="kv"><span>${t('score')}</span><span>${s.score??t('notTested')}</span></div><span class="chip ${b}" style="align-self:flex-start">${txt}</span></div>
  <button class="btn pri" id="dTest">${ICONS.probe}<span>${t('testProbe')}</span></button>
  <button class="btn sec2" id="dDel" style="color:var(--bad)">${t('remove')}</button>`);
  $('#dTest').querySelector('svg').style.cssText='width:14px;height:20px';
  $('#dTest').onclick=()=>{closeSheet();go('probe')};
  let armed=false;$('#dDel').onclick=e=>{if(!armed){armed=true;e.currentTarget.textContent=t('confirmRemove');return}
    silos.splice(i,1);saveSilos();renderSilos();closeSheet();toast(t('removed'))};
}
function addStockSheet(){
  const today=new Date().toISOString().slice(0,10); let type='bunker',crop='maize';
  const chips=(k,list,sel)=>`<div class="chips" data-chips="${k}">${list.map(v=>`<button type="button" data-v="${v}" aria-pressed="${v===sel}">${t(k+'_'+v)}</button>`).join('')}</div>`;
  openSheet(`<div class="grab"></div><h2>${t('addStock')}</h2>
  <form id="stockForm" novalidate style="display:flex;flex-direction:column;gap:16px">
   <div class="field"><label for="sName">${t('f_name')}</label><input type="text" id="sName" placeholder="Bunker-${silos.length+1}" autocomplete="off"><p class="err" id="eName" hidden>${t('errName')}</p></div>
   <div class="field"><label>${t('f_type')}</label>${chips('type',['bunker','bag','pit','bale'],type)}</div>
   <div class="field"><label>${t('f_crop')}</label>${chips('crop',['maize','sorghum','napier','other'],crop)}</div>
   <div class="field"><label for="sQty">${t('f_qty')}</label><input type="number" id="sQty" inputmode="decimal" min="0" step="0.1" placeholder="10"><p class="err" id="eQty" hidden>${t('errQty')}</p></div>
   <div class="field"><label for="sDate">${t('f_date')}</label><input type="date" id="sDate" value="${today}" max="${today}"><p class="err" id="eDate" hidden>${t('errDate')}</p></div>
   <label class="check"><input type="checkbox" id="sOpen"><span>${t('f_open')}</span></label>
   <div class="row"><button type="button" class="btn sec2" id="sCancel">${t('cancel')}</button><button type="submit" class="btn pri">${t('saveStock')}</button></div>
  </form>`);
  $$('#sheet [data-chips] button').forEach(b=>b.onclick=()=>{const g=b.parentElement;g.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));
    if(g.dataset.chips==='type')type=b.dataset.v;else crop=b.dataset.v});
  ['sName','sQty','sDate'].forEach(id=>$('#'+id).addEventListener('input',()=>$('#e'+id.slice(1)).hidden=true));
  $('#sCancel').onclick=closeSheet;
  $('#stockForm').onsubmit=e=>{e.preventDefault();const name=$('#sName').value.trim(),qty=parseFloat($('#sQty').value),date=$('#sDate').value;let bad=false;
    if(!name){$('#eName').hidden=false;bad=true} if(!(qty>0)){$('#eQty').hidden=false;bad=true} if(!date){$('#eDate').hidden=false;bad=true} if(bad)return;
    silos.unshift({id:Date.now(),name,type,crop,qty,filled:date,opened:$('#sOpen').checked,score:null,img:null});saveSilos();renderSilos();closeSheet();toast(t('stockSaved'))};
}
$('#addStockBtn').onclick=addStockSheet;

/* ---------- bottom sheet ---------- */
function openSheet(html){$('#sheet').innerHTML=html;$('#scrim').hidden=false}
function closeSheet(){$('#scrim').hidden=true;$('#sheet').innerHTML='';stopVoice()}
$('#scrim').addEventListener('click',e=>{if(e.target.id==='scrim')closeSheet()});

/* ---------- voice commands (Web Speech API, en-IN / ta-IN / hi-IN) ---------- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition; let rec=null;
const KW={
 lang_ta:['tamil','தமிழ்'],lang_hi:['hindi','हिंदी','हिन्दी'],lang_en:['english','ஆங்கிலம்','अंग्रेज़ी','अंग्रेजी','इंग्लिश'],
 add:['add','new stock','சேர்','जोड़','जोड','नया स्टॉक'],feed:['feed','give','கொடுக்க','தீவனம்','खिला'],
 scan:['scan','camera','ஸ்கேன்','கேமரா','स्कैन','कैमरा'],upload:['upload','photo','picture','image','படம்','புகைப்பட','பதிவேற்','फ़ोटो','फोटो','तस्वीर','अपलोड'],
 probe:['probe','sensor','test','reading','nutrient','ப்ரோப்','சென்சார்','சோதனை','அளவீடு','ஊட்டச்சத்து','प्रोब','सेंसर','टेस्ट','जाँच','जांच','रीडिंग','पोषक'],
 silos:['silo','stock','bunker','சைலோ','இருப்பு','பங்கர்','साइलो','स्टॉक','बंकर'],settings:['setting','language','அமைப்பு','மொழி','सेटिंग','भाषा']};
const ORDER=['lang_ta','lang_hi','lang_en','add','feed','scan','upload','probe','silos','settings'];
function intent(text){const s=text.toLowerCase();return ORDER.find(k=>KW[k].some(w=>s.includes(w.toLowerCase())))||null}
function runIntent(k){
  if(k&&k.startsWith('lang_')){setLang(k.slice(5));voiceSheet(true);return true}
  if(k==='feed'){const bad=current&&current.kind==='bad',msg=t(bad?'ans_nofeed':'ans_feed');const a=$('#vAns');if(a){a.hidden=false;a.className='answer'+(bad?' bad':'');a.textContent=msg}speak(msg);return true}
  const map={add:()=>{go('silos');addStockSheet()},scan:()=>{closeSheet();go('scan')},upload:()=>{closeSheet();$('#fileUp').click()},probe:()=>{closeSheet();go('probe')},silos:()=>{closeSheet();go('silos')},settings:()=>{closeSheet();go('settings')}};
  if(map[k]){map[k]();return true}return false}
function speak(txt){if(!window.speechSynthesis)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(txt);u.lang=VOICE[lang];u.rate=.92;
  const v=speechSynthesis.getVoices().find(v=>v.lang.replace('_','-').startsWith(VOICE[lang].slice(0,2)));if(v)u.voice=v;speechSynthesis.speak(u)}
function voiceSheet(quiet){
  const cmds=[['probe','c_probe'],['scan','c_scan'],['upload','c_upload'],['silos','c_silos'],['add','c_add'],['feed','c_feed']];
  openSheet(`<div class="grab"></div><button class="micbig" id="vMic" aria-label="${t('tapMic')}">${ICONS.mic}</button>
  <div class="heard" aria-live="polite"><small id="vState">${t('tapMic')}</small><b id="vText"></b></div>
  <div class="answer" id="vAns" hidden></div>
  <div class="field"><label id="vTry">${t('tryThese')}</label><div class="cmds">${cmds.map(c=>`<button data-cmd="${c[0]}">${t(c[1])}</button>`).join('')}</div></div>
  <form class="typerow" id="vForm"><input type="text" id="vType" placeholder="${t('typeHere')}" autocomplete="off"><button class="btn pri" style="flex:none" type="submit">${t('go')}</button></form>`);
  $$('#sheet [data-cmd]').forEach(b=>b.onclick=()=>{$('#vText').textContent=b.textContent;runIntent(b.dataset.cmd)});
  $('#vForm').onsubmit=e=>{e.preventDefault();handleSpeech($('#vType').value)};
  $('#vMic').onclick=listen;
  if(!SR){$('#vState').textContent=t('noMic')}else if(!quiet)listen();
}
function scriptLang(s){if(/[\u0B80-\u0BFF]/.test(s))return'ta';if(/[\u0900-\u097F]/.test(s))return'hi';return null}
function handleSpeech(text){if(!text.trim())return;
  const sl=scriptLang(text);if(sl&&sl!==lang){setLang(sl);voiceSheet(true)}$('#vText').textContent='“'+text+'”';$('#vState').textContent=t('youSaid');
  if(!runIntent(intent(text))){$('#vState').textContent=t('notUnderstood')}}
function listen(){if(!SR){$('#vState').textContent=t('noMic');return}stopVoice();
  rec=new SR();rec.lang=VOICE[lang];rec.interimResults=true;rec.maxAlternatives=1;let final='';
  rec.onstart=()=>{$('#vMic')?.classList.add('on');$('#vState')&&($('#vState').textContent=t('listening'))};
  rec.onresult=e=>{let txt='';for(const r of e.results){txt+=r[0].transcript;if(r.isFinal)final=txt}$('#vText')&&($('#vText').textContent=txt)};
  rec.onerror=e=>{$('#vMic')?.classList.remove('on');if($('#vState'))$('#vState').textContent=(e.error==='not-allowed'||e.error==='service-not-allowed')?t('noMic'):t('notUnderstood')};
  rec.onend=()=>{$('#vMic')?.classList.remove('on');const txt=final||($('#vText')?.textContent||'');if(txt&&$('#vState'))handleSpeech(txt)};
  try{rec.start()}catch(e){$('#vState').textContent=t('noMic')}}
function stopVoice(){try{rec&&rec.abort()}catch(e){}rec=null}
$('#voiceBtn').onclick=voiceSheet;

function renderModel(){$('#checks').innerHTML=t('checks').map(c=>`<span><i style="background:var(--maize)"></i>${c}</span>`).join('');
  $('#bands').innerHTML=[['good','70–100'],['watch','40–69'],['bad','0–39']].map(b=>`<div class="band"><span class="chip ${b[0]}">${t('st_'+b[0])}</span><span>${b[1]}</span></div>`).join('')}

/* ---------- i18n ---------- */
function applyLang(){document.documentElement.lang=lang;
  $$('[data-t]').forEach(el=>{const v=t(el.dataset.t);if(typeof v==='string')el.textContent=v});
  $$('[data-lang-cycle]').forEach(b=>b.innerHTML=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg>${LBL[lang]}`);
  $$('#langSeg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===lang));
  $$('#demoSeg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.d===demo));
  $('#tipText').textContent=t('tips')[new Date().getDate()%3];
  renderProbe();renderHist();renderSilos();renderModel();if(current)renderResult();
  try{localStorage.setItem('fiq_lang',lang)}catch(e){}}
function setLang(l){lang=l;applyLang();speechSynthesis?.cancel?.()}
document.addEventListener('click',e=>{const c=e.target.closest('[data-lang-cycle]');if(c)setLang(LANGS[(LANGS.indexOf(lang)+1)%3])});
$$('#langSeg button').forEach(b=>b.onclick=()=>setLang(b.dataset.l));
$$('#demoSeg button').forEach(b=>b.onclick=()=>{demo=b.dataset.d;applyLang()});

/* ---------- navigation ---------- */
const TABS=['home','silos','settings','model'];
function go(id,push=true){ if(id!=='scan')stopCam();
  $$('.screen').forEach(s=>s.hidden=s.id!==id);
  $('#nav').hidden=id==='scan';
  $$('.tab').forEach(b=>b.setAttribute('aria-current',b.dataset.tab===id||(!TABS.includes(id)&&b.dataset.tab==='home')));
  if(push&&stack[stack.length-1]!==id)stack.push(id);
  if(TABS.includes(id))stack=[id];
  $('#'+id).scrollTop=0; if(id==='scan')startCam(); }
document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g)go(g.dataset.go);const tb=e.target.closest('[data-tab]');if(tb)go(tb.dataset.tab);
  if(e.target.closest('[data-back]')){stack.pop();go(stack[stack.length-1]||'home',false)}});

/* ---------- upload ---------- */
$('#upBtn').onclick=()=>$('#fileUp').click();
$('#again').onclick=()=>$('#fileUp').click();
async function handleFile(f,forced){if(!f)return;const buf=await f.arrayBuffer();const src=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(f)});analyse(src,buf,forced)}
$('#fileUp').onchange=e=>{handleFile(e.target.files[0]);e.target.value=''};
$('#fileCam').onchange=e=>{handleFile(e.target.files[0],demo==='auto'?null:demo);e.target.value=''};
$('#camPhoto').onclick=()=>$('#fileCam').click();

/* ---------- live camera ---------- */
async function startCam(){$('#nocam').hidden=true;
  try{if(!navigator.mediaDevices?.getUserMedia)throw 0;stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280}},audio:false});$('#vid').srcObject=stream;await $('#vid').play().catch(()=>{})}
  catch(e){stream=null;$('#nocam').hidden=false}}
function stopCam(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}}
$('#shutter').onclick=()=>{const v=$('#vid');if(!stream||!v.videoWidth){$('#fileCam').click();return}
  const s=Math.min(v.videoWidth,v.videoHeight)*.8,c=document.createElement('canvas');c.width=c.height=640;
  c.getContext('2d').drawImage(v,(v.videoWidth-s)/2,(v.videoHeight-s)/2,s,s,0,0,640,640);
  stopCam();analyse(c.toDataURL('image/jpeg',.85),null,demo==='auto'?null:demo)};

/* ---------- save + speak ---------- */
$('#saveProbe').onclick=()=>{addHistory({kind:'good',score:84,type:'probe',time:Date.now()});toast(t('saved'))};
function toast(m){const el=$('#toast');el.textContent=m;el.classList.add('on');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('on'),1800)}
document.addEventListener('click',e=>{const b=e.target.closest('[data-speak]');if(!b||!window.speechSynthesis)return;speechSynthesis.cancel();
  let txt;if(b.dataset.speak==='probe')txt=[t('probeVerdict'),t('useWithin').replace('{n}',7),...t('probeAdv')].join('. ');
  else{const g=current?.kind==='good';txt=[t(g?'g_title':'b_title'),t(g?'g_sub':'b_sub'),...t(g?'g_adv':'b_adv')].join('. ')}
  const u=new SpeechSynthesisUtterance(txt);u.lang=VOICE[lang];u.rate=.92;const v=speechSynthesis.getVoices().find(v=>v.lang.replace('_','-').startsWith(VOICE[lang].slice(0,2)));if(v)u.voice=v;speechSynthesis.speak(u)});

/* ---------- installable app (PWA) ---------- */
let deferredInstall=null;
const standalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;$('#installBtn').hidden=false});
$('#installBtn').onclick=async()=>{if(!deferredInstall)return;deferredInstall.prompt();try{await deferredInstall.userChoice}catch(e){}deferredInstall=null;$('#installBtn').hidden=true};
window.addEventListener('appinstalled',()=>{$('#installBtn').hidden=true;$('#installHint').textContent=t('installed')});
if('serviceWorker' in navigator&&location.protocol==='https:'&&!location.hostname.endsWith('claude.ai')&&!location.hostname.includes('claudeusercontent')){
  navigator.serviceWorker.register('sw.js').catch(()=>{})}

try{const l=localStorage.getItem('fiq_lang');if(LANGS.includes(l))lang=l}catch(e){}
paintIcons();applyLang();go('home');
if(standalone())$('#installHint').textContent=t('installed');
</script>
